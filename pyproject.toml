[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "skillplus"
version = "0.2.1"
description = "Official Python SDK for SkillPlus"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SkillPlus" }]
keywords = ["skillplus", "ai", "security", "sdk"]
dependencies = ["httpx>=0.28"]

[project.urls]
Homepage = "https://skillplus.xyz"
Documentation = "https://docs.skillplus.xyz"
Repository = "https://github.com/SkillPlusHQ/skillplus-python"
Issues = "https://github.com/SkillPlusHQ/skillplus-python/issues"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8",
    "respx>=0.22",
]

[tool.hatch.build.targets.wheel]
packages = ["src/skillplus"]

[tool.hatch.build.targets.sdist]
include = ["src/skillplus", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
